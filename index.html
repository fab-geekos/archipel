<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipel</title>
<meta name="description" content="Les projets de Fabien, réunis au même endroit.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#061610">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230f1f1b'/%3E%3Ccircle%20cx='11'%20cy='11'%20r='3.2'%20fill='%23e8a33d'/%3E%3Ccircle%20cx='21'%20cy='15'%20r='2.2'%20fill='%23e8a33d'%20opacity='.68'/%3E%3Ccircle%20cx='13.5'%20cy='21.5'%20r='1.6'%20fill='%23e8a33d'%20opacity='.42'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip" href="#readout">Aller à la description du projet</a>

  <header class="masthead">
    <span class="wordmark">archipel</span>
    <span class="counter" id="counter" aria-hidden="true"></span>
  </header>

  <main class="stage">
    <div class="ring" id="ring" role="group" aria-roledescription="carrousel" aria-label="Projets"></div>

    <button class="arrow arrow--prev" id="prev" type="button" aria-label="Projet précédent">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <button class="arrow arrow--next" id="next" type="button" aria-label="Projet suivant">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </main>

  <section class="readout" id="readout" aria-live="polite">
    <p class="readout__tagline" id="tagline"></p>
    <h1 class="readout__name" id="name"></h1>
    <p class="readout__desc" id="desc"></p>
    <p class="readout__host"><span id="host"></span></p>
  </section>

  <footer class="footer">
    <div class="dots" id="dots" role="group" aria-label="Choisir un projet"></div>
    <p class="hint">
      <kbd>←</kbd><kbd>→</kbd> naviguer
      <span class="hint__sep" aria-hidden="true">·</span>
      <kbd>Entrée</kbd> ouvrir
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
